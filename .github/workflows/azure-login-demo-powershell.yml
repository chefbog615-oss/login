name: Azure Login Demo with PowerShell

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  azure-login-powershell:
    name: Azure login and PowerShell verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with AzPSSession
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Verify Azure login in PowerShell
        shell: pwsh
        run: |
          Connect-AzAccount
          Get-AzContext
